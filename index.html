<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CFEFFF">
<title>Topo App</title>
<meta name="description" content="Leer de 12 provincies en hoofdsteden van Nederland met Bo de ballon. Voor kinderen vanaf 7 jaar.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#CFEFFF; --sky2:#E9F8FF; --sea:#9ED9FF; --sea-line:#86CCF7;
  --abroad:#E4F1D6; --ink:#1F2A55; --muted:#56628F; --card:#FFFFFF;
  --sun:#FFC83D; --sun-dark:#E0A20C; --good:#2DB86A; --good-dark:#1E8E50;
  --oops:#FF6B5E; --btn:#FFFFFF; --btn-edge:#C9D6F2; --primary:#3D7BFF; --primary-dark:#2457CC;
  --map-ink:#1F2A55; --dim:#EEF3FC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#13204A; --sky2:#1A2B5E; --sea:#24467E; --sea-line:#2D5594;
    --abroad:#2B3D63; --ink:#F2F5FF; --muted:#AEBBE6; --card:#22346A;
    --btn:#2A3F7C; --btn-edge:#152450; --dim:#3A4E85;
  }
}
:root[data-theme="dark"]{
  --sky:#13204A; --sky2:#1A2B5E; --sea:#24467E; --sea-line:#2D5594;
  --abroad:#2B3D63; --ink:#F2F5FF; --muted:#AEBBE6; --card:#22346A;
  --btn:#2A3F7C; --btn-edge:#152450; --dim:#3A4E85;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font-family:"Fredoka","Baloo 2","Comic Neue","Trebuchet MS",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(120px 60px at 12% 8%, var(--sky2) 60%, transparent 62%),
    radial-gradient(160px 70px at 88% 18%, var(--sky2) 60%, transparent 62%),
    radial-gradient(140px 60px at 70% 92%, var(--sky2) 60%, transparent 62%),
    var(--sky);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:12px 14px 28px;min-height:100%}

/* top bar */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.topbar .title{font-weight:700;font-size:clamp(.82rem,3.9vw,1.25rem);overflow:hidden;text-overflow:ellipsis;flex:1;display:flex;align-items:center;gap:5px;white-space:nowrap;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;box-shadow:0 3px 0 var(--btn-edge)}
.iconbtn{border:0;background:var(--card);border-radius:14px;width:42px;height:42px;font-size:1.25rem;box-shadow:0 3px 0 var(--btn-edge);display:grid;place-items:center}
.iconbtn:active{transform:translateY(3px);box-shadow:none}
.iconbtn[aria-pressed="false"]{opacity:.5}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}

.screen{display:none}
.screen.on{display:block}

/* mascot + speech */
.bo-row{display:flex;align-items:flex-end;gap:10px;margin:4px 0 14px}
.bo{width:86px;flex:none}
.bo.small{width:58px}
.bo svg{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:no-preference){
  .bo svg{animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px)}}
}
.bubble{position:relative;background:var(--card);border-radius:22px;padding:12px 16px;font-size:1.12rem;line-height:1.4;font-weight:500;box-shadow:0 4px 0 var(--btn-edge);flex:1}
.bubble::before{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:var(--card);border-left:0}

/* home hero */
.hero{margin-bottom:16px}
.hero .nlmap{max-height:46vh}
.hero-bo{position:absolute;left:12px;top:10px;width:66px;z-index:1}
.hero-chip{position:absolute;right:12px;bottom:12px;font-size:.95rem}
.bubble.up{margin:0 0 18px}
.bubble.up::before{left:34px;top:-10px;bottom:auto;border:10px solid transparent;border-bottom-color:var(--card);border-top:0}
.mini .prov{cursor:default}
.mini .emo{font-size:20px;text-anchor:middle;dominant-baseline:central}
/* home route */
h1{font-size:2rem;line-height:1.1;margin:6px 0 4px;font-weight:700}
.route{list-style:none;margin:0;padding:0 0 0 0;position:relative}
.route::before{content:"";position:absolute;left:31px;top:30px;bottom:30px;border-left:4px dashed var(--btn-edge)}
.route li{position:relative;margin:0 0 12px}
.stop{width:100%;display:flex;align-items:center;gap:14px;border:0;text-align:left;background:var(--card);border-radius:24px;padding:12px 14px 12px 10px;box-shadow:0 5px 0 var(--btn-edge)}
.stop:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-edge)}
.stop .num{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;position:relative;z-index:1}
.stop .txt{flex:1}
.stop .t{display:block;font-weight:700;font-size:1.2rem}
.stop .d{display:block;color:var(--muted);font-size:.98rem;line-height:1.3}
.stop .stars{font-size:1.05rem;letter-spacing:1px;white-space:nowrap}
.star-on{color:var(--sun)} .star-off{color:var(--btn-edge)}
.album-btn{width:100%;margin-top:6px;border:0;border-radius:24px;padding:14px;background:var(--sun);color:#1F2A55;font-weight:700;font-size:1.15rem;box-shadow:0 5px 0 var(--sun-dark);display:flex;align-items:center;justify-content:center;gap:10px}
.album-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sun-dark)}

/* play header */
.playbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dots{flex:1;display:flex;gap:5px;flex-wrap:wrap}
.dots i{flex:1;min-width:14px;height:12px;border-radius:6px;background:var(--card);box-shadow:inset 0 0 0 2px var(--btn-edge)}
.dots i.ok{background:var(--good);box-shadow:none}
.dots i.half{background:var(--sun);box-shadow:none}
.dots i.now{box-shadow:inset 0 0 0 3px var(--primary)}

.qcard{background:var(--card);border-radius:24px;padding:12px 14px;box-shadow:0 4px 0 var(--btn-edge);margin-bottom:10px;display:flex;gap:10px;align-items:center;min-height:74px}
.qcard .q{flex:1;font-size:1.25rem;font-weight:600;line-height:1.3}
.qcard .q b{font-weight:700;color:var(--primary)}
.city-tag{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:#1F2A55;border-radius:14px;padding:2px 12px;font-weight:700;font-size:1.4rem;margin-top:2px}
.say{flex:none}

.hint{display:none;border-radius:18px;padding:10px 14px;margin:0 0 10px;font-size:1.05rem;line-height:1.4;font-weight:500;background:#FFF4D6;color:#1F2A55;border:3px solid var(--sun)}
.hint.on{display:block}
.hint.good{background:#DDF7E8;border-color:var(--good)}

/* map */
.mapwrap{position:relative;background:var(--sea);border-radius:28px;box-shadow:0 5px 0 var(--sea-line);overflow:hidden;margin-bottom:12px}
.nlmap{display:block;width:100%;height:auto;max-height:50vh;overflow:visible;margin:0 auto;touch-action:manipulation}
.prov{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .18s ease, opacity .25s ease}
.prov path{stroke:#fff;stroke-width:2.6;stroke-linejoin:round;transition:filter .2s}
.prov:focus{outline:none}
.prov:focus-visible path{stroke:var(--primary);stroke-width:4}
.nlmap.dim-others .prov:not(.hi) path{fill:var(--dim)}
.prov.hi{transform:translateY(-5px)}
.prov.hi path{stroke:var(--map-ink);stroke-width:3.4}
.prov.picked path{stroke:var(--map-ink);stroke-width:3.4}
.prov.picked{transform:translateY(-5px)}
.prov.right path{stroke:var(--good);stroke-width:5}
.prov.wrong path{stroke:var(--oops);stroke-width:4}
@media (prefers-reduced-motion:no-preference){
  .prov.wrong{animation:shake .45s}
  @keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
  .prov.right{animation:pop .5s}
  @keyframes pop{40%{transform:translateY(-8px) scale(1.07)}100%{transform:translateY(-5px)}}
  .prov.pulse path{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{stroke-width:7;stroke:var(--sun)}}
}
.prov.pulse path{stroke:var(--sun-dark);stroke-width:5}
.caps,.names{pointer-events:none;transition:opacity .2s}
.nlmap:not(.show-caps) .caps{opacity:0}
.nlmap:not(.show-names) .names{opacity:0}
.nlmap.show-names .cap.same text{opacity:0}
.caps .cap{opacity:1}
.nlmap.one-cap .caps .cap{opacity:0}
.nlmap.one-cap .caps .cap.solo{opacity:1}
.nlmap.one-cap .caps .cap.solo text{opacity:0}
.map-lbl{font:600 15px "Fredoka",sans-serif;fill:var(--muted);opacity:.85}
.prov-lbl{font:700 15px "Fredoka",sans-serif;fill:var(--map-ink);paint-order:stroke;stroke:#ffffffcc;stroke-width:4px;stroke-linejoin:round}
.cap-lbl{font:600 13px "Fredoka",sans-serif;fill:var(--map-ink);paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round}

/* options */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.three .opt:last-child{grid-column:1/-1}
#play.has-opts .nlmap{max-height:40vh}
.opt{border:0;border-radius:20px;padding:12px 8px;background:var(--btn);font-size:1.25rem;font-weight:700;box-shadow:0 5px 0 var(--btn-edge);min-height:58px}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-edge)}
.opt.right{background:var(--good);color:#fff;box-shadow:0 5px 0 var(--good-dark)}
.opt.wrong{background:var(--oops);color:#fff;box-shadow:0 5px 0 #C9443A;opacity:.6}
.opt.show{background:var(--good);color:#fff;box-shadow:0 5px 0 var(--good-dark)}
@media (prefers-reduced-motion:no-preference){ .opt.show{animation:throb 1s ease-in-out infinite} @keyframes throb{50%{transform:scale(1.04)}} }
.opt:disabled{cursor:default}

/* explore sheet */
.sheet{background:var(--card);border-radius:24px;padding:14px 16px 16px;box-shadow:0 4px 0 var(--btn-edge)}
.sheet .head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.badge{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:2rem;box-shadow:inset 0 -5px 0 #0000001f}
.sheet h2{margin:0;font-size:1.6rem;line-height:1.1}
.sheet .capline{font-size:1.15rem;font-weight:500;color:var(--muted)}
.sheet .capline b{color:var(--ink)}
.sheet p{margin:8px 0 0;font-size:1.05rem;line-height:1.45}
.sheet .row{display:flex;gap:10px;align-items:flex-start}
.sheet .row span:first-child{flex:none;font-size:1.3rem;line-height:1.3}
.explore-count{text-align:center;color:var(--muted);font-weight:500;margin:10px 0 0}

/* album */
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stk{background:var(--card);border-radius:22px;padding:12px 6px 10px;text-align:center;box-shadow:0 4px 0 var(--btn-edge)}
.stk .disc{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:2rem;border:4px solid #fff;box-shadow:0 3px 0 #0000002a}
.stk .n{font-weight:700;font-size:.98rem;line-height:1.15}
.stk .c{font-size:.88rem;color:var(--muted)}
.stk.locked .disc{background:var(--btn-edge)!important;filter:grayscale(1);opacity:.6}
.stk.locked .n{color:var(--muted)}
.stk.new{box-shadow:0 0 0 4px var(--sun),0 4px 0 var(--btn-edge)}
.stk .meter{display:flex;justify-content:center;gap:3px;margin-top:5px}
.stk .meter i{width:9px;height:9px;border-radius:50%;background:var(--btn-edge)}
.stk .meter i.f{background:var(--good)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.95rem;padding:10px;display:block;margin:14px auto 0}

/* end */
.end{text-align:center;padding-top:10px}
.bigstars{font-size:3.4rem;letter-spacing:6px;margin:6px 0}
.end h2{font-size:1.9rem;margin:4px 0}
.end p{font-size:1.15rem;line-height:1.4;margin:6px 0 16px}
.newstk{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.newstk .disc{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;border:4px solid #fff;box-shadow:0 3px 0 #0000002a}
.btnrow{display:grid;gap:10px}
.big{border:0;border-radius:22px;padding:16px;font-size:1.25rem;font-weight:700;background:var(--primary);color:#fff;box-shadow:0 5px 0 var(--primary-dark)}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--primary-dark)}
.big.alt{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--btn-edge)}

/* exit dialog */
.modal{position:fixed;inset:0;background:#1F2A5599;display:none;place-items:center;z-index:80;padding:20px}
.modal.on{display:grid}
.modal .box{background:var(--card);border-radius:28px;padding:20px;max-width:340px;width:100%;text-align:center;box-shadow:0 6px 0 var(--btn-edge)}
.modal .box .bo{width:90px;margin:0 auto 6px}
.modal h2{margin:0 0 6px;font-size:1.5rem}
.modal p{margin:0 0 16px;font-size:1.1rem;line-height:1.4}
/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti span{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall var(--t) linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.toast-star{position:fixed;left:50%;top:40%;font-size:4rem;transform:translate(-50%,-50%);pointer-events:none;z-index:60;animation:starpop .9s ease-out forwards}
@keyframes starpop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-140%) scale(.8);opacity:0}}
@media (prefers-reduced-motion:reduce){ .toast-star{animation:none;opacity:0} }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="topbar">
    <div class="title">Topo App</div>
    <span class="pill" aria-label="Sterren"><span aria-hidden="true">⭐</span><span id="starCount">0</span></span>
    <button class="iconbtn" id="voiceBtn" aria-pressed="true" aria-label="Voorlezen aan of uit" title="Voorlezen">🗣️</button>
    <button class="iconbtn" id="soundBtn" aria-pressed="true" aria-label="Geluid aan of uit" title="Geluid">🔔</button>
  </div>

  <!-- HOME -->
  <section class="screen on" id="home">
    <div class="mapwrap hero" id="homeMap">
      <div class="bo hero-bo" aria-hidden="true" data-bo></div>
      <span class="pill hero-chip" id="heroChip"></span>
    </div>
    <div class="bubble up" id="homeBubble"></div>
    <ol class="route" id="route"></ol>
    <button class="album-btn" id="albumBtn"><span aria-hidden="true">📒</span> Mijn stickerboek <span class="pill" style="box-shadow:none" id="albumCount">0/12</span></button>
  </section>

  <!-- PLAY / EXPLORE -->
  <section class="screen" id="play">
    <div class="playbar">
      <button class="iconbtn" id="backBtn" aria-label="Terug naar het begin">🏠</button>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </div>
    <div class="qcard">
      <div class="q" id="question" aria-live="polite"></div>
      <button class="iconbtn say" id="sayBtn" aria-label="Lees de vraag voor">🔊</button>
    </div>
    <div class="hint" id="hint" aria-live="polite"></div>
    <div class="mapwrap" id="mapSlot"></div>
    <div id="below"></div>
  </section>

  <!-- ALBUM -->
  <section class="screen" id="album">
    <div class="playbar">
      <button class="iconbtn" data-home aria-label="Terug naar het begin">🏠</button>
      <h1 style="font-size:1.6rem;margin:0">Mijn stickerboek</h1>
    </div>
    <div class="bo-row">
      <div class="bo small" aria-hidden="true" data-bo></div>
      <div class="bubble" id="albumBubble"></div>
    </div>
    <div class="album" id="albumGrid"></div>
    <button class="linkbtn" id="resetBtn">Alles wissen en opnieuw beginnen</button>
  </section>

  <!-- END -->
  <section class="screen" id="end">
    <div class="end">
      <div class="bo" style="margin:0 auto;width:110px" aria-hidden="true" data-bo></div>
      <div class="bigstars" id="endStars"></div>
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <div class="newstk" id="endStickers"></div>
      <div class="btnrow">
        <button class="big" id="againBtn">Nog een keer spelen</button>
        <button class="big alt" data-home>Terug naar de route</button>
      </div>
    </div>
  </section>
</div>

<div class="modal" id="exitModal" role="dialog" aria-modal="true" aria-labelledby="exitTitle">
  <div class="box">
    <div class="bo" aria-hidden="true" data-bo></div>
    <h2 id="exitTitle">Ga je al weg?</h2>
    <p>Bo zwaait je gedag! Je sterren en stickers blijven bewaard.</p>
    <div class="btnrow">
      <button class="big" id="stayBtn">Nee, verder spelen!</button>
      <button class="big alt" id="quitBtn">Ja, stoppen</button>
    </div>
  </div>
</div>

/* ---------- Projection ---------- */
const LON0=3.25, LAT1=53.58, KX=0.613*200, KY=200, PAD=6;
const W = Math.round((7.35-LON0)*KX + PAD*2), H = Math.round((LAT1-50.68)*KY + PAD*2);
const proj = ([lon,lat]) => [ +((lon-LON0)*KX+PAD).toFixed(1), +((LAT1-lat)*KY+PAD).toFixed(1) ];
const ringPath = r => "M"+r.map(pt=>proj(pt).join(",")).join("L")+"Z";

function centroid(r){
  let a=0,cx=0,cy=0;
  for(let i=0;i<r.length;i++){const [x1,y1]=r[i],[x2,y2]=r[(i+1)%r.length];const f=x1*y2-x2*y1;a+=f;cx+=(x1+x2)*f;cy+=(y1+y2)*f;}
  a/=2; return [cx/(6*a), cy/(6*a)];
}
P.forEach(p=>{
  p.mid = centroid(p.rings[0]);
  const dLat=p.mid[1]-52.2, dLon=p.mid[0]-5.4;
  let ns = dLat>0.35?"noord":dLat<-0.35?"zuid":"", ew = dLon>0.5?"oost":dLon<-0.5?"west":"";
  p.richting = (ns||ew) ? (ns+ew+"en") : "midden";
});
const richtingZin = p => p.richting==="midden" ? `${p.naam} ligt in het midden van Nederland.` : `${p.naam} ligt in het ${p.richting} van Nederland.`;

/* ---------- Sound & voice ---------- */
let ac=null;
function tone(seq){
  if(!S.sound) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    let t=ac.currentTime;
    seq.forEach(([f,d,type])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05);t+=d*.8;});
  }catch(e){}
}
const sndGood=()=>tone([[660,.12],[880,.12],[1175,.22]]);
const sndOops=()=>tone([[330,.16,"triangle"],[262,.22,"triangle"]]);
const sndTap=()=>tone([[520,.07]]);
const sndWin=()=>tone([[523,.12],[659,.12],[784,.12],[1047,.3]]);

function loadVoices(){ try{ const v=speechSynthesis.getVoices(); nlVoice=v.find(x=>/^nl[-_]NL/i.test(x.lang))||v.find(x=>/^nl/i.test(x.lang))||null; }catch(e){} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
let lastSpoken="";
function say(text,force){
  lastSpoken=text;
  if(!(S.voice||force) || !("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const clean=text.replace(/<[^>]+>/g,"").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,"").replace(/'s-Hertogenbosch/g,"s Hertogenbosch");
    const u=new SpeechSynthesisUtterance(clean); u.lang="nl-NL"; if(nlVoice)u.voice=nlVoice; u.rate=.92; u.pitch=1.08;
    speechSynthesis.speak(u);
  }catch(e){}
}
$("#sayBtn").onclick=()=>say(lastSpoken,true);

  c.querySelectorAll(".prov").forEach(g=>{
    g.removeAttribute("tabindex"); g.removeAttribute("role"); g.setAttribute("class","prov");
    const id=g.dataset.id, path=g.querySelector("path");
    if(S.stickers.includes(id)){ const [x,y]=proj(nameAt[id]); const t=svgEl("text",{x,y,class:"emo"},c); t.textContent=byId[id].emoji; }
    else { path.style.fill="var(--dim)"; path.style.stroke="#B9C6E6"; path.style.strokeDasharray="5 4"; }
  });
  hm.prepend(c);
  $("#heroChip").textContent=`🖍️ ${S.stickers.length} van 12 ingekleurd`;
  const total=S.stickers.length;
  $("#homeBubble").textContent = total===12 ? "Wauw, je hebt alle 12 stickers! Jij bent een echte Nederland-kenner." :
    S.seen.length<12 ? "Hoi! Ik ben Bo de ballon. Samen kleuren we de kaart van Nederland in. Begin bij stap 1!" :
    "Goed bezig! Elke sticker kleurt een provincie in. Speel stap 2, 3 en 4.";
  show("home");
}

/* ---------- Explore ---------- */
function startExplore(){
  $("#play").classList.remove("has-opts"); mapReset(); map.classList.add("show-caps","show-names");
  $("#dots").innerHTML=""; $("#hint").className="hint";
  setQ("Tik op een provincie om haar te leren kennen.");
  say("Tik op een provincie om haar te leren kennen.");
  $("#below").innerHTML=`<p class="explore-count" id="seenCount"></p>`;
  updateSeen();
  onProv = id=>{
    sndTap(); mapReset(); map.classList.add("show-caps","show-names");
    provClass(id,"picked");
    const p=byId[id], first=!S.seen.includes(id);
    if(first){S.seen.push(id); addStars(1); save();}
    $("#below").innerHTML=`<div class="sheet">
      <div class="head"><div class="badge" style="background:${p.kleur}" aria-hidden="true">${p.emoji}</div>
      <div><h2>${p.naam}</h2><div class="capline">Hoofdstad: <b>${cityName(p)}</b></div></div></div>
      <div class="row"><span aria-hidden="true">💡</span><p style="margin:0">${p.tip}</p></div>
      <div class="row" style="margin-top:8px"><span aria-hidden="true">🤩</span><p style="margin:0">${p.feit}</p></div>
    </div><p class="explore-count" id="seenCount"></p>`;
    setQ(`<b>${p.naam}</b> — hoofdstad <b>${cityShort(p)}</b>`);
    say(`${p.naam}. De hoofdstad is ${p.stad}. ${p.tip}`);
    updateSeen();
    if(first && S.seen.length===12){ setTimeout(()=>{confetti(70);sndWin();say("Hoera! Je hebt alle twaalf provincies bekeken!");},600); }
  };
  show("play");
}
function updateSeen(){ const n=S.seen.length; const e=$("#seenCount"); if(e) e.textContent = n<12 ? `Je hebt ${n} van de 12 provincies bekeken.` : "Je hebt alle 12 provincies bekeken! Probeer nu stap 2."; }
function setQ(html){ $("#question").innerHTML=html; }

/* ---------- Quiz engine ---------- */
const PRAISE=["Goed zo!","Super!","Knap gedaan!","Helemaal goed!","Jij bent slim!","Yes, raak!","Top!"];
const ROUND=8;
let Q=null;
const skillOf = mode => mode==="zoek" ? "loc" : "cap";

function weightedRound(mode){
  const sk=skillOf(mode), w=[6,4,2,1];
  let pool=P.map(p=>({p,w:w[Math.min(3,S.m[p.id][sk])]})), out=[];
  while(out.length<ROUND && pool.length){
    const tot=pool.reduce((a,b)=>a+b.w,0); let r=Math.random()*tot, i=0;
    while((r-=pool[i].w)>0 && i<pool.length-1) i++;
    out.push(pool[i].p); pool.splice(i,1);
  }
  return out;
}
function startQuiz(mode){
  Q={mode, list:weightedRound(mode), i:0, first:0, asked:0, tries:0, redo:0, locked:false, marks:[]};
  show("play"); nextQ();
}
function renderDots(){
  const d=$("#dots"); d.innerHTML="";
  Q.list.forEach((_,i)=>{const e=document.createElement("i"); if(Q.marks[i])e.className=Q.marks[i]; if(i===Q.i)e.classList.add("now"); d.appendChild(e);});
}
function hint(html,good){ const h=$("#hint"); h.innerHTML=html; h.className="hint on"+(good?" good":""); }
function nextQ(){
  if(Q.i>=Q.list.length) return endQuiz();
  Q.tries=0; Q.locked=false; Q.p=Q.list[Q.i]; Q.asked++;
  $("#hint").className="hint"; $("#below").innerHTML="";
  mapReset(); renderDots(); $("#play").classList.toggle("has-opts",Q.mode==="stad");
  const p=Q.p;
  if(Q.mode==="zoek"){
    setQ(`Waar ligt <b>${p.naam}</b>? Tik erop!`);
    say(`Waar ligt ${p.naam}? Tik erop!`);
    onProv=id=>answerMap(id);
  } else if(Q.mode==="thuis"){
    map.classList.add("show-caps","one-cap");
    setQ(`In welke provincie ligt<br><span class="city-tag">🏙️ ${cityShort(p)}</span>`);
    say(`In welke provincie ligt ${cityShort(p)}? Breng de stad thuis!`);
    onProv=id=>answerMap(id);
  } else {
    map.classList.add("dim-others","show-caps","one-cap"); provClass(p.id,"hi");
    map.querySelector(`.cap[data-id="${p.id}"]`).classList.add("solo");
    setQ(`Wat is de hoofdstad van <b>${p.naam}</b>?`);
    say(`Wat is de hoofdstad van ${p.naam}?`);
    onProv=null;
    const n = S.m[p.id].cap>=2 ? 4 : 3;
    const opts=shuffle([p].concat(shuffle(P.filter(x=>x!==p)).slice(0,n-1)));
    const box=document.createElement("div"); box.className="opts"+(n===3?" three":"");
    opts.forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=cityShort(o);b.dataset.id=o.id;b.onclick=()=>answerOpt(o.id,b);box.appendChild(b);});
    $("#below").appendChild(box);
  }
}
function level(delta){ const m=S.m[Q.p.id], sk=skillOf(Q.mode); m[sk]=Math.max(0,Math.min(3,m[sk]+delta)); save(); }
function good(){
  Q.locked=true;
  if(Q.tries===0){ Q.first++; level(+1); addStars(1); starPop(); Q.marks[Q.i]="ok"; }
  else if(Q.tries===1){ Q.marks[Q.i]="half"; addStars(1); }
  else { Q.marks[Q.i]=Q.marks[Q.i]||"half"; }
  save(); sndGood(); confetti(Q.tries===0?28:12);
  const p=Q.p, praise=Q.tries<2?pick(PRAISE):"Zo is het!";
  const line = Q.mode==="zoek" ? `${praise} Dit is ${p.naam}.` : `${praise} ${cityShort(p)} is de hoofdstad van ${p.naam}.`;
  hint(`<b>${line}</b>`,true); say(line);
  setTimeout(()=>{Q.i++; nextQ();}, 1900);
}
function miss(){
  Q.tries++; sndOops();
  const p=Q.p;
  if(Q.tries===1){
    let h;
    if(Q.mode==="zoek") h=`Bijna! 🧭 ${richtingZin(p)} Probeer het nog een keer.`;
    else if(Q.mode==="stad") h=`Oei, nog niet. 💡 ${p.tip}`;
    else h=`Nog niet! 🧭 ${cityShort(p)} ligt in het ${p.richting==="midden"?"midden":p.richting} van Nederland. Probeer opnieuw.`;
    hint(h); say(h);
  } else {
    level(-1);
    if(Q.redo<3 && !Q.list.slice(Q.i+1).includes(p)){ Q.list.push(p); Q.redo++; }
    Q.marks[Q.i]="half"; renderDots();
    let h;
    if(Q.mode==="stad") h=`Dit is het goede antwoord: <b>${cityShort(p)}</b>. Tik erop! 💡 ${p.tip}`;
    else h=`Kijk, hier ligt <b>${p.naam}</b>! Tik er zelf op. ${Q.mode==="thuis"?"💡 "+p.tip:""}`;
    hint(h); say(h.replace(/<[^>]+>/g,""));
  }
}
function answerMap(id){
  if(Q.locked) return;
  mapReset(); if(Q.mode==="thuis") map.classList.add("show-caps","one-cap");
  if(Q.tries>=2) provClass(Q.p.id,"pulse");
  if(id===Q.p.id){
    provClass(id,"right");
    if(Q.mode==="thuis"){ const c=map.querySelector(`.cap[data-id="${id}"]`); c.classList.add("solo"); map.classList.remove("one-cap"); map.querySelectorAll(".cap").forEach(x=>{if(x!==c)x.style.opacity="0";}); setTimeout(()=>map.querySelectorAll(".cap").forEach(x=>x.style.opacity=""),1800); }
    good();
  } else {
    provClass(id,"wrong");
    miss();
    if(Q.tries>=2) provClass(Q.p.id,"pulse");
  }
}
function answerOpt(id,btn){
  if(Q.locked) return;
  if(id===Q.p.id){
    btn.className="opt right"; document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    provClass(Q.p.id,"right"); good();
  } else {
    btn.className="opt wrong"; btn.disabled=true;
    miss();
    if(Q.tries>=2){ document.querySelectorAll(".opt").forEach(b=>{ if(b.dataset.id===Q.p.id) b.className="opt show"; else b.disabled=true; }); }
  }
}
function checkStickers(){
  const fresh=[];
  P.forEach(p=>{const m=S.m[p.id]; if(m.loc>=2 && m.cap>=2 && !S.stickers.includes(p.id)){S.stickers.push(p.id);fresh.push(p);}});
  save(); return fresh;
}
function endQuiz(){
  onProv=null;
  const pct=Q.first/Q.asked, stars = pct>=.85?3:pct>=.55?2:1;
  S.best[Q.mode]=Math.max(S.best[Q.mode]||0,stars); save();
  const fresh=checkStickers();
  $("#endStars").innerHTML=starsHtml(stars);
  $("#endTitle").textContent = stars===3?"Fantastisch!":stars===2?"Goed gedaan!":"Goed geoefend!";
  let txt = `Je had er ${Q.first} in één keer goed.`;
  txt += stars===3 ? " Jij weet het echt!" : stars===2 ? " Nog een rondje en je wordt een kampioen." : " Oefenen maakt je slimmer. De lastige provincies komen vaker terug.";
  const msLeft = P.filter(p=>!S.stickers.includes(p.id)).length;
  if(fresh.length) txt += ` En je verdient ${fresh.length===1?"een nieuwe sticker":fresh.length+" nieuwe stickers"}!`;
  else if(msLeft && Q.mode==="zoek" && S.best.stad===0) txt += " Tip: speel ook ‘Welke hoofdstad?’ om stickers te verdienen.";
  $("#endText").textContent=txt;
  $("#endStickers").innerHTML=fresh.map(p=>`<div class="disc" style="background:${p.kleur}" title="${p.naam}">${p.emoji}</div>`).join("");
  $("#againBtn").onclick=()=>startQuiz(Q.mode);
  show("end"); sndWin(); confetti(stars*30);
  say(`${$("#endTitle").textContent} ${txt}`);
  Q.fresh=fresh.map(p=>p.id);
}

/* ---------- Album ---------- */
$("#albumBtn").onclick=()=>{sndTap(); openAlbum();};
function openAlbum(){
  const g=$("#albumGrid"); g.innerHTML="";
  const recent = (Q&&Q.fresh)||[];
  P.forEach(p=>{
    const have=S.stickers.includes(p.id), m=S.m[p.id];
    const pts=Math.min(2,m.loc)+Math.min(2,m.cap);
    const d=document.createElement("div"); d.className="stk"+(have?"":" locked")+(recent.includes(p.id)?" new":"");
    d.innerHTML=`<div class="disc" style="background:${p.kleur}" aria-hidden="true">${have?p.emoji:"?"}</div><div class="n">${p.naam}</div><div class="c">${have?cityShort(p):"&nbsp;"}</div>${have?"":`<div class="meter" aria-label="${pts} van 4 stappen">${[0,1,2,3].map(i=>`<i class="${i<pts?"f":""}"></i>`).join("")}</div>`}`;
    g.appendChild(d);
  });
  const n=S.stickers.length;
  $("#albumBubble").textContent = n===12 ? "Je boek is vol! Alle 12 stickers. Wat knap!" :
    `Je hebt ${n} van de 12 stickers. Een sticker verdien je als je twee keer weet waar de provincie ligt én twee keer de hoofdstad weet. De bolletjes laten zien hoe ver je bent.`;
  show("album");
}
$("#resetBtn").onclick=()=>{ if(confirm("Weet je het zeker? Alle sterren en stickers worden gewist.")){ const v=S.voice,s=S.sound; S=fresh(); S.voice=v;S.sound=s; save(); $("#starCount").textContent=0; navHome(); } };

goHome();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
})();
</script>
